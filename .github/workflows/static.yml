# 将静态内容部署到GitHub Pages的简单工作流
名称: 将静态内容部署到Pages

在：
  # 在推送到默认分支时运行
推送：
分支: ["main"]

  # 允许您从“操作”选项卡手动运行此工作流
工作流调度：

# 将 GITHUB_TOKEN 的权限设置为允许部署到 GitHub Pages
权限:
内容: 读取
页面: 写入
ID令牌: 写入

# 仅允许一次并发部署，跳过正在进行的部署与最新排队之间的运行。
# 但请勿取消正在进行的部署，因为我们希望这些生产部署能够顺利完成。
并发:
组: “页面”
取消进行中: false

作业:
  # 单次部署作业，因为我们只是在部署
部署:
环境:
名称: github页面
      url: ${{ steps.deployment.outputs.page_url }}
运行于: ubuntu-latest
步骤:
      - 名称: 检出
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
